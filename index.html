<!doctype html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AthReebo｜6項目サーベイ</title>
<style>
:root{
  --bg:#eef2fb;--app:#f5f6fa;--card:#fff;--text:#111827;--sub:#475467;--muted:#667085;--line:#e7eaf2;
  --nav:#13161d;--ink:#171a22;--blue:#3f6cff;--blue-d:#3158e6;--blue-soft:#eef3ff;--blue-line:#c7d7ff;
  --gray:#98a2b3;--gray-soft:#edf0f5;--orange:#f97316;--orange-d:#c2410c;--orange-soft:#fff2e8;--orange-line:#fdba74;
  --green:#12805c;--green-soft:#e8f6ef;
  --shadow:0 18px 40px rgba(16,24,40,.12);
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:linear-gradient(180deg,#f6f8ff 0%,#e8eefb 100%);color:var(--text);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;padding:28px 24px 48px;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
[hidden]{display:none!important}

.app{max-width:1320px;margin:0 auto;background:var(--app);border:1px solid rgba(17,24,39,.06);border-radius:28px;overflow:clip;box-shadow:var(--shadow)}
.top{height:76px;background:var(--nav);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:16px}
.brand{display:flex;align-items:center;gap:18px;min-width:0}
.brand img{height:40px;width:auto;display:block}
.brand .sep{width:1px;height:30px;background:rgba(255,255,255,.22)}
.brand .prod{line-height:1.25}
.brand .prod b{display:block;font-size:15px;font-weight:800;letter-spacing:.02em}
.brand .prod span{font-size:11px;color:#c3cad7;letter-spacing:.14em;font-weight:700}
.top-right{display:flex;align-items:center;gap:12px;font-size:13px;color:#c3cad7;min-width:0}
.top-right #whoLabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.pill{border-radius:999px;padding:7px 16px;font-size:12px;font-weight:800;background:#fff;color:var(--text);white-space:nowrap}
.pill.blue{background:var(--blue);color:#fff}
.preview-bar{background:var(--orange-soft);color:#7c2d12;font-size:12px;font-weight:700;padding:8px 28px;border-bottom:1px solid var(--orange-line)}

.body{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:760px}
.side{background:#fff;border-right:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;gap:22px}
.side h4{margin:0 0 8px;font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:800}
.snav{display:grid;gap:4px}
.snav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:700;color:#344054;min-height:40px}
.snav button:hover:not(:disabled){background:var(--blue-soft)}
.snav button:disabled{color:#c0c6d2;cursor:default}
.snav button.active{background:var(--ink);color:#fff}
.snav .dot{width:22px;height:22px;flex:0 0 22px;border-radius:999px;border:1.5px solid #d0d5dd;display:grid;place-items:center;font-size:11px;font-weight:900;color:var(--muted);background:#fff}
.snav button.active .dot{border-color:#fff;color:var(--ink)}
.snav .dot.done{background:var(--blue);border-color:var(--blue);color:#fff}
.side-progress{margin-top:auto;background:var(--app);border:1px solid var(--line);border-radius:16px;padding:14px}
.side-progress .k{font-size:12px;color:var(--muted);font-weight:800}
.side-progress .v{font-size:24px;font-weight:900;letter-spacing:-.02em}
.side-progress .v small{font-size:13px;color:var(--muted);font-weight:800}

.main{padding:36px 44px 40px;min-width:0}
.eyebrow{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.06em;margin-bottom:6px}
h1{font-size:32px;line-height:1.35;letter-spacing:-.02em;margin:0 0 10px}
h2{font-size:28px;line-height:1.35;letter-spacing:-.02em;margin:0}
h3{font-size:17px;margin:0 0 6px;font-weight:800}
.lead{margin:8px 0 0;color:var(--sub);font-size:15px;line-height:1.8}
.small{font-size:12px}.muted{color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px}
.stack{display:grid;gap:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;margin-top:22px}
.grid2.even{grid-template-columns:1fr 1fr}
.notice{background:var(--blue-soft);border:1px solid var(--blue-line);border-left:3px solid var(--blue);border-radius:16px;padding:16px 20px;font-size:13px;color:#344054}
.notice b{color:#253b80}
.warn{background:var(--orange-soft);border:1px solid var(--orange-line);border-left:3px solid var(--orange);border-radius:16px;padding:14px 18px;font-size:14px;color:#7c2d12}
.ok{background:var(--green-soft);border:1px solid #a6dcc3;border-left:3px solid var(--green);border-radius:16px;padding:16px 20px;font-size:14px;color:#0b4f39}
.caption{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.7}

.btn{border-radius:16px;font-weight:800;min-height:48px;padding:12px 22px;border:1px solid var(--line);background:#fff;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--blue-soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:#12151c;border-color:#12151c;color:#fff;font-size:16px;font-weight:900}
.btn.primary:hover:not(:disabled){background:#2b303d}
.btn.sm{min-height:36px;padding:7px 14px;font-size:12px;border-radius:999px}
.btn.link{border:0;background:transparent;color:var(--blue-d);text-decoration:underline;padding:8px 4px;min-height:0;font-weight:700}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px;flex-wrap:wrap}
.actions .right{display:flex;gap:10px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;border:1px solid var(--line);background:#fff;color:#344054;border-radius:999px;padding:6px 11px;font-size:11px;font-weight:800;line-height:1;white-space:nowrap}
.tag.orange{color:var(--orange-d);border-color:var(--orange-line);background:var(--orange-soft)}
.tag.blue{color:var(--blue-d);border-color:var(--blue-line);background:var(--blue-soft)}
button.tag{cursor:pointer;padding:9px 14px;font-size:12px}
button.tag.active{background:var(--ink);color:#fff;border-color:var(--ink)}

/* intro */
.idcard{margin-top:22px;max-width:640px}
.field{display:grid;gap:6px;margin-top:16px}
.field:first-child{margin-top:0}
.field label{font-size:13px;font-weight:800}
.field label .req{color:var(--orange-d);font-size:11px;margin-left:6px}
.field input{border:1px solid #d0d5dd;border-radius:12px;padding:12px 14px;background:#fff;font-size:16px;width:100%}
.field input:disabled{background:var(--app);color:var(--sub)}
.field .hint{font-size:12px;color:var(--muted)}
.inline{display:flex;gap:10px;align-items:stretch}
.inline input{flex:1;min-width:0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px;max-width:640px}
.fact{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 18px}
.fact .k{font-size:12px;color:var(--muted);font-weight:800}
.fact .v{font-size:19px;font-weight:900;letter-spacing:-.01em}
.spinner{display:inline-block;width:16px;height:16px;border:2.5px solid var(--blue-line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:#ac3e2a;font-weight:800;font-size:13px;margin-top:8px}

/* questions */
.qsticky{position:sticky;top:0;z-index:5;background:var(--app);padding:14px 0 2px;margin-top:10px}
.qprog{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:800}
.qprog b{color:var(--text)}
.track{height:8px;background:var(--gray-soft);border-radius:999px;overflow:hidden;margin:8px 0 10px}
.track .fill{height:100%;background:var(--blue);border-radius:999px;transition:width .2s}
.qlist{background:#fff;border:1px solid var(--line);border-radius:22px;padding:0 32px}
.qitem{border-top:1px solid var(--line);padding:34px 0 30px;text-align:center;transition:background .2s}
.qitem:first-child{border-top:0}
.qitem.missing{background:var(--orange-soft);margin:0 -32px;padding-left:32px;padding-right:32px}
.qtext{display:flex;flex-direction:column;align-items:center;gap:12px;margin:0 0 22px}
.qno{background:var(--gray-soft);color:#475467;border-radius:999px;padding:3px 16px;font-size:13px;font-weight:800}
.qt{font-size:17px;font-weight:700;line-height:1.6;color:var(--text)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);max-width:640px;margin:0 auto}
.opt{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.circle{width:50px;height:50px;border-radius:999px;border:3px solid #d0d5dd;background:#fff;transition:border-color .15s,background .15s,box-shadow .15s,transform .15s}
.opt:hover .circle{border-color:#9db4ff;transform:scale(1.05)}
.opt input:checked+.circle{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 5px #fff,0 4px 14px rgba(63,108,255,.25)}
.opt input:focus-visible+.circle{outline:3px solid var(--blue);outline-offset:3px}
.olab{font-size:12px;color:var(--muted);font-weight:700;min-height:18px;white-space:nowrap}
.opt input:checked~.olab{color:var(--blue-d)}
.slegend{display:none}
.error{color:#ac3e2a;font-weight:800;font-size:14px;margin-top:14px;min-height:1px}

/* results */
.radar-card{text-align:center}
.legend{display:flex;justify-content:center;gap:18px;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:4px}
.legend i{display:inline-block;width:18px;height:3px;border-radius:999px;vertical-align:middle;margin-right:5px;background:var(--gray)}
.legend i.b{background:var(--blue)}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini-box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.mini-box .ttl{font-size:12px;font-weight:900;margin-bottom:4px;color:var(--blue-d)}
.mini-box .ttl.orange{color:var(--orange-d)}
.mini-box .row{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:800;margin-top:8px}
.score-list{display:grid;gap:14px;margin-top:6px}
.score-item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:4px 0;border-radius:10px}
.score-item:hover .label{color:var(--blue-d)}
.score-item .meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.score-item .label{font-size:15px;font-weight:800}
.score-item .value{font-size:16px;font-weight:900}
.bar{height:8px;background:var(--gray-soft);border-radius:999px;overflow:hidden;position:relative}
.bar>div{position:absolute;left:0;top:0;height:100%;border-radius:999px}
.f-blue{background:var(--blue)}.f-gray{background:var(--gray)}.f-orange{background:var(--orange)}.f-pre{background:#cfd6e5}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.hero-stat{background:var(--ink);color:#fff;border-radius:18px;padding:16px 18px}
.hero-stat .k{font-size:12px;opacity:.8;font-weight:700}
.hero-stat .v{font-size:17px;font-weight:900;line-height:1.3;margin-top:4px}
.hero-stat .big{font-size:34px;line-height:1}
.delta{display:inline-block;margin-left:8px;background:var(--blue);color:#fff;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:900}
.delta.flat{background:#e5e7eb;color:#475467}
.delta.down{background:var(--orange-soft);color:var(--orange-d)}
.nums{font-size:13px;font-weight:800;color:#344054;white-space:nowrap}
.tabchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.big-score{font-size:52px;line-height:1;font-weight:900;letter-spacing:-.03em}
.unit{font-size:15px;color:var(--muted);font-weight:800}
.subrow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;margin-top:8px}
.bullets{list-style:none;padding:0;margin:10px 0 0}
.bullets li{position:relative;padding-left:18px;margin-bottom:8px;font-size:14px;line-height:1.6;color:#344054}
.bullets li::before{content:'';position:absolute;left:0;top:8px;width:8px;height:8px;border-radius:999px;background:var(--orange)}
.qblock{padding:14px 0;border-top:1px solid var(--line)}
.qblock:first-of-type{border-top:0}
.qblock .q{font-size:14px;font-weight:700;line-height:1.6;margin-bottom:8px}
.likert{display:grid;grid-template-columns:52px repeat(5,1fr);gap:6px;align-items:center;margin-top:4px}
.likert .lb{font-size:11px;color:var(--muted);font-weight:800}
.likert div.c{height:30px;border-radius:8px;background:#f1f3f8;color:#98a2b3;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.likert div.c.on{background:var(--orange);color:#fff}
.likert div.c.on.b{background:var(--blue)}
.qmeta{font-size:12px;color:var(--muted);margin-top:6px}
.focus-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px 24px}
.focus-card .row{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}
.focus-card .title{font-size:20px;font-weight:900;margin-top:8px}
.improve{font-size:46px;line-height:1;font-weight:900;letter-spacing:-.03em}
.mtable{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.mtable .h,.mtable .l{display:grid;grid-template-columns:1fr auto;gap:12px;font-size:13px}
.mtable .h{color:var(--muted);font-weight:800;margin-bottom:6px}
.mtable .l{padding:5px 0;color:#344054}
.chg{font-weight:900;white-space:nowrap}.up{color:var(--blue)}.stay{color:var(--orange-d)}
.methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:22px}
.method-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;position:relative;display:flex;flex-direction:column}
.method-card .no{position:absolute;top:16px;right:20px;color:#d0d5dd;font-size:30px;font-weight:900}
.method-title{font-size:19px;font-weight:900;margin:10px 0 6px}
.why{font-size:13px;color:var(--sub);line-height:1.7}
.subcard{background:#f8faff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.subcard .k{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:2px}
.subcard .v{font-size:14px;line-height:1.6;font-weight:700}
.todo{background:var(--nav);color:#fff;border-radius:22px;padding:22px 24px;margin-top:16px}
.todo h4{margin:0 0 12px;font-size:15px}
.todo ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.todo li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.55}
.todo .box{width:18px;height:18px;background:#fff;border-radius:4px;flex:0 0 18px;margin-top:2px}
.all-methods{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
.all-methods div{border:1px solid var(--line);border-radius:14px;padding:12px;font-size:12px;line-height:1.55;background:#fff;color:var(--sub)}
.all-methods b{display:block;color:var(--text);font-size:13px;margin-bottom:2px}
.savebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:14px;padding:10px 16px;font-size:13px;font-weight:700;margin-bottom:16px}
.savebar.saving{background:var(--blue-soft);color:#253b80}
.savebar.saved{background:var(--green-soft);color:#0b4f39}
.savebar.failed{background:var(--orange-soft);color:#7c2d12}
.foot{font-size:12px;color:var(--muted);padding:16px 28px 22px;border-top:1px solid var(--line);background:#fff}

@media(max-width:1080px){
  .body{grid-template-columns:1fr}
  .side{display:none}
  .grid2,.grid2.even{grid-template-columns:1fr}
  .all-methods{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:720px){
  body{padding:0;background:var(--app)}
  .app{border-radius:0;border:0;box-shadow:none}
  .top{height:60px;padding:0 14px}
  .brand img{height:28px}.brand .sep,.brand .prod{display:none}
  .top-right #whoLabel{display:none}
  .preview-bar{padding:8px 14px}
  .main{padding:22px 14px 28px}
  h1{font-size:24px}h2{font-size:22px}.lead{font-size:14px}
  .card,.focus-card,.method-card{padding:18px;border-radius:18px}
  .facts,.hero-stats,.mini-grid{grid-template-columns:1fr}
  .facts{grid-template-columns:repeat(3,1fr);gap:8px}.fact{padding:10px 12px}.fact .v{font-size:15px}
  .inline{flex-direction:column}
  .qlist{padding:0 14px;border-radius:18px}
  .qitem{padding:26px 0 22px}
  .qitem.missing{margin:0 -14px;padding-left:14px;padding-right:14px}
  .qt{font-size:16px;text-align:left}
  .qtext{align-items:flex-start;gap:8px;margin-bottom:18px}
  .circle{width:44px;height:44px}
  .olab{display:none}
  .opt{gap:0}
  .slegend{display:grid;grid-template-columns:repeat(3,1fr);font-size:11px;color:var(--muted);font-weight:700;line-height:1.35;margin-top:8px}
  .slegend span:first-child{text-align:left}.slegend span:nth-child(2){text-align:center}.slegend span:last-child{text-align:right}
  .hero-stats{gap:8px}.hero-stat{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.hero-stat .v{margin-top:0;text-align:right}.hero-stat .big{font-size:26px}
  .actions{flex-direction:column-reverse;align-items:stretch}
  .actions .btn{width:100%}
  .actions .right{justify-content:center}
  .big-score{font-size:42px}
  .tabchips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .foot{padding:14px}
}
@media print{
  body{background:#fff;padding:0}
  .app{box-shadow:none;border:0;border-radius:0}
  .side,.actions,.tabchips,.no-print,.savebar{display:none!important}
  .body{grid-template-columns:1fr}
  .top{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card,.focus-card,.method-card{break-inside:avoid}
}
</style>
</head>
<body>
<div class="app">

async function callApi(action,data){
  const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action},data))});
  const j=await res.json();if(!j.ok)throw new Error(j.error||"error");return j.result;

    if(code==="closed")return ok({name:"デモ研修（受付終了）",open:"closed",pre:"10/1〜10/3",post:"10/20〜10/24"});

  lookup(e,code){return new Promise(ok=>setTimeout(()=>{e=e.trim().toLowerCase();let pre=null,post=null,base=null;

};

function radar(series,labels){
  const M=window.innerWidth<720;
  const cx=280,cy=182,R=M?96:116,ang=i=>(-90+i*60)*Math.PI/180;
  const pt=(i,v)=>[cx+R*(v/5)*Math.cos(ang(i)),cy+R*(v/5)*Math.sin(ang(i))];
  let g='<g fill="none" stroke="#e5e7eb" stroke-width="1">';
  for(let l=1;l<=5;l++)g+=`<polygon points="${[0,1,2,3,4,5].map(i=>pt(i,l).map(n=>n.toFixed(1)).join(",")).join(" ")}"/>`;
  for(let i=0;i<6;i++){const[x,y]=pt(i,5);g+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`}
  g+="</g>";
  series.forEach(s=>{const pts=s.vals.map((v,i)=>pt(i,v||0).map(n=>n.toFixed(1)).join(",")).join(" ");
    g+=`<polygon points="${pts}" fill="${s.fill}" stroke="${s.stroke}" stroke-width="${s.w||3}" ${s.dash?'stroke-dasharray="5 4"':""}/>`;
    if(s.dots)s.vals.forEach((v,i)=>{const[x,y]=pt(i,v||0);g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="${s.dots[i]}"/>`});});
  labels.forEach((lb,i)=>{const a=ang(i),x=cx+(R+24)*Math.cos(a),y=cy+(R+24)*Math.sin(a);
    const anchor=Math.abs(Math.cos(a))<.2?"middle":Math.cos(a)>0?"start":"end";
    const fs=M?23:16,y0=i===0?y-(M?30:22):i===3?y+(M?20:14):y-(M?8:6);
    g+=`<text x="${x.toFixed(1)}" y="${y0.toFixed(1)}" text-anchor="${anchor}" font-size="${fs}" font-weight="800" fill="#344054">${esc(lb[0])}</text>`;
    g+=`<text x="${x.toFixed(1)}" y="${(y0+fs+5).toFixed(1)}" text-anchor="${anchor}" font-size="${fs+1}" font-weight="900" fill="${lb[2]||"#344054"}">${esc(lb[1])}</text>`;});
  return `<svg viewBox="${M?"-75 -8 710 400":"-50 0 660 380"}" width="100%" role="img" aria-label="6項目のレーダーチャート">${g}</svg>`;
}

  if(!S.code){S.blocked="NO_CODE";render(false);return}
  try{S.training=await API.info(S.code);if(S.training.open==="closed")S.blocked="CLOSED"}
  catch(e){if(!apiError(e))S.blocked="NET"}
  render(false);
})();
</script>
